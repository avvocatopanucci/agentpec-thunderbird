[project]
name = "agentpec"
version = "0.2.0"
description = "Connettore MCP in sola lettura tra Thunderbird e un agente IA, pensato per la PEC di uno studio legale."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "defusedxml>=0.7.1",
]

[project.scripts]
agentpec-server = "agentpec.mcp_server:main"
agentpec-bridge = "agentpec.bridge:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
